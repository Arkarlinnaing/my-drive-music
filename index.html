<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Drive Music - V6 Albums</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--panel:#fff;--panel2:#f7f7fa;--line:#d9d9df;--text:#222329;--muted:#85858e;--accent:#f0c93e;--accent2:#fff3b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:150px}header{position:sticky;top:0;z-index:20;background:rgba(243,243,248,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px 8px}.topline{display:flex;align-items:center;gap:10px;min-height:46px}.brand-dot{display:inline-flex;width:38px;height:38px;border-radius:50%;background:#5a5a60;color:white;align-items:center;justify-content:center;font-size:20px}.brand-title{font-weight:750;font-size:17px;flex:1}.btn{min-height:40px;padding:8px 12px;border:1px solid #dedee4;border-radius:11px;font-weight:650;cursor:pointer;background:#fff;color:#333}.btn:hover{background:#f8f8fb}.primary{background:#f1cc43;color:#282414;border-color:#e7c33d}.navicons{display:flex;justify-content:space-around;align-items:center;padding:7px 0 10px;color:#888892;font-size:24px}.navicons span{width:42px;height:36px;display:flex;align-items:center;justify-content:center}.navicons .selected{color:#e5b91d}.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;background:#fff;margin:0 -16px;padding:0 12px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;color:#777780;padding:12px 18px;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}.tabs button.active{color:#222;border-bottom-color:#eac536;font-weight:700}.wrap{max-width:1120px;margin:auto;padding:16px 16px}.status{color:var(--muted);margin:0 0 12px;font-size:13px}.tools{display:flex;gap:10px;margin-bottom:12px}.tools input{width:100%;background:#fff;color:#222;border:1px solid #dedee5;border-radius:12px;padding:12px 14px;outline:none;font-size:15px}.tools input:focus{border-color:#d8b72d}.summary{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);margin-bottom:6px}.shuffle-play{border:1px solid #e9c638;color:#d4aa12;background:transparent;width:42px;height:42px;border-radius:50%;font-size:20px}.summary-text{font-size:14px;flex:1}.summary-text span{color:var(--muted)}.album-section{margin:10px 0 20px}.album-heading{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--line);padding:0 2px 8px;margin-bottom:2px}.album-title{font-size:16px;font-weight:800}.album-count{font-size:12px;color:var(--muted)}.album-grid{display:flex;flex-direction:column;gap:0}.grid{display:block}.card{display:flex;align-items:center;gap:14px;background:transparent;padding:12px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;min-width:0;transition:background .12s}.card:hover{background:rgba(255,255,255,.55)}.card.active{background:var(--accent2)}.cover{width:78px;height:78px;flex:0 0 78px;border-radius:2px;background:linear-gradient(135deg,#e6e6e9,#c9c9ce);display:flex;align-items:center;justify-content:center;font-size:31px;color:#888;margin:0}.song-info{min-width:0;flex:1}.name{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:13px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-more{font-size:24px;color:#777;margin:0 4px}.player{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px max(10px,env(safe-area-inset-bottom));z-index:30}.player-inner{max-width:1120px;margin:auto}.nowrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}.nowcover{width:44px;height:44px;border-radius:2px;background:#d5d5d9;display:flex;align-items:center;justify-content:center;font-size:22px;color:#85858c;flex:0 0 auto}.now{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:3px}.controls .btn{min-width:42px;border:0;background:transparent;font-size:21px;padding:4px 9px}.controls .main{font-size:25px;border:1px solid #d9d9df;border-radius:50%;width:50px;height:50px}.mode{font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}audio{width:100%;height:27px}#disconnect{color:#a53c3c}@media(min-width:700px){.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{display:block;background:#fff;padding:12px;border:1px solid var(--line);border-radius:10px}.cover{width:100%;height:auto;aspect-ratio:1;margin-bottom:10px}.row-more{display:none}.player{padding-left:20px;padding-right:20px}}@media(max-width:600px){header{padding:9px 12px 0}.brand-title{font-size:16px}.wrap{padding:12px}.cover{width:78px;height:78px;flex-basis:78px}.name{font-size:15px}.meta{font-size:12px}.player{padding-left:10px;padding-right:10px}.controls{position:absolute;right:10px;top:12px;gap:4px}.controls .btn{min-width:35px;padding:4px 6px}.controls .main{width:46px;height:46px}.nowrow{padding-right:145px;min-height:48px}audio{height:24px}.mode{display:none}.summary{padding:10px 2px}.album-heading{margin-top:14px}}
</style>
</head>
<body>
<header>
<div class="topline"><span class="brand-dot">●</span><div class="brand-title">My Drive Music</div><button class="btn primary" id="connect">Connect Drive</button><button class="btn" id="refresh" hidden>↻</button><button class="btn" id="disconnect" hidden>Disconnect</button></div>
<div class="navicons"><span>♟</span><span class="selected">♫</span><span>☷</span><span>☁</span><span>◎</span><span id="searchIcon">⌕</span></div>
<div class="tabs" id="viewTabs"><button data-view="title">Title</button><button data-view="folder">Folder</button><button class="active" data-view="album">Album</button><button data-view="artist">Artist</button></div>
</header>
<div class="wrap">
<div class="status" id="status">Ready — connect your Google Drive.</div>
<div class="tools" id="tools" hidden><input id="search" placeholder="Search songs, albums, folders..."></div>
<div class="summary" id="summary" hidden><button class="shuffle-play" id="shuffleAll">▶</button><div class="summary-text">Shuffle all <span id="totalCount">/ Total 0</span></div><button class="btn" id="listMode" aria-label="View options">☷</button></div>
<div id="library" class="grid"></div>
</div>
<div class="player">
<div class="player-inner">
<div class="nowrow"><div class="nowcover">♫</div><div style="min-width:0;flex:1"><div class="now" id="now">Nothing playing</div><div class="sub">My Drive Music</div></div></div>
<div class="controls">
<button class="btn" id="prev" aria-label="Previous">⏮</button><button class="btn main" id="toggle" aria-label="Play or pause">▶</button><button class="btn" id="next" aria-label="Next">⏭</button>
<button class="btn" id="shuffle" aria-label="Shuffle">🔀</button><button class="btn" id="repeat" aria-label="Repeat">🔁</button>
</div>
<div class="mode" id="mode">Shuffle: Off · Repeat: Off</div>
<audio id="audio" controls preload="metadata"></audio>
</div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
const CLIENT_ID="47016789140-ro981mmscma2m2mm89agnnojddfk00lv.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/drive.readonly";
const AUDIO_EXT=/\.(mp3|flac|m4a|mp4|ogg|oga|wav|aac|opus)$/i;
let token=null,tokenClient,files=[],visibleFiles=[],currentIndex=-1,shuffle=false,repeat=false,currentObjectUrl=null,folderNames=new Map(),viewMode='album';
let activeController=null;
const blobCache=new Map();
const prefetching=new Map();
const statusEl=document.getElementById('status'),library=document.getElementById('library'),audio=document.getElementById('audio'),search=document.getElementById('search'),toggleBtn=document.getElementById('toggle');
function status(x){statusEl.textContent=x}
function formatSize(bytes){if(!bytes)return '';const n=Number(bytes);if(n<1048576)return Math.round(n/1024)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'}
function extension(name){const m=name.match(/\.([^.]+)$/);return m?m[1].toUpperCase():'AUDIO'}
function render(){
 const term=search.value.trim().toLowerCase();
 visibleFiles=files.filter(f=>!term||f.name.toLowerCase().includes(term)||albumFor(f).toLowerCase().includes(term));
 library.innerHTML='';
 document.getElementById('totalCount').textContent='/ Total '+files.length;
 if(!visibleFiles.length){status(files.length?'No matching music.':'No audio files found in Drive.');return}
 status(visibleFiles.length+' songs · '+new Set(visibleFiles.map(albumFor)).size+' albums/folders');
 const groups=new Map();
 if(viewMode==='title') groups.set('All Songs',visibleFiles);
 else if(viewMode==='artist') groups.set('Artist information unavailable',visibleFiles);
 else visibleFiles.forEach(f=>{const key=albumFor(f);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f)});
 for(const [groupName,songs] of groups){
  const section=document.createElement('section');section.className='album-section';
  if(viewMode!=='title'){
   const heading=document.createElement('div');heading.className='album-heading';
   const title=document.createElement('div');title.className='album-title';title.textContent=groupName;
   const count=document.createElement('div');count.className='album-count';count.textContent=songs.length+' song'+(songs.length===1?'':'s');
   heading.append(title,count);section.appendChild(heading);
  }
  const grid=document.createElement('div');grid.className='album-grid';
  songs.forEach(f=>{const c=document.createElement('div');c.className='card';if(files[currentIndex]?.id===f.id)c.classList.add('active');
   c.innerHTML='<div class="cover">♫</div><div class="song-info"><div class="name"></div><div class="meta"></div></div><div class="row-more">⌄</div>';c.querySelector('.name').textContent=f.name.replace(/\.[^.]+$/,'');c.querySelector('.meta').textContent=(viewMode==='artist'?'Unknown artist · ':'')+extension(f.name)+(f.size?' · '+formatSize(f.size):'');c.onclick=()=>{currentIndex=files.findIndex(x=>x.id===f.id);play(f)};grid.appendChild(c)});
  section.appendChild(grid);library.appendChild(section);
 }
}

function albumFor(f){
 const parent=(f.parents&&f.parents.length)?f.parents[0]:null;
 return (parent&&folderNames.get(parent))||'All Music';
}
function playFileByVisibleIndex(i){const f=visibleFiles[i];currentIndex=files.findIndex(x=>x.id===f.id);play(f)}
function init(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async r=>{if(r.error){status('Google authorization failed: '+r.error);return}token=r.access_token;document.getElementById('connect').hidden=true;document.getElementById('disconnect').hidden=false;document.getElementById('refresh').hidden=false;document.getElementById('tools').hidden=false;document.getElementById('summary').hidden=false;await loadFiles()}})}
document.getElementById('connect').onclick=()=>tokenClient.requestAccessToken({prompt:'consent'});
document.getElementById('refresh').onclick=()=>{if(token)loadFiles()};
document.getElementById('disconnect').onclick=()=>{if(activeController)activeController.abort();if(token)google.accounts.oauth2.revoke(token);token=null;files=[];visibleFiles=[];currentIndex=-1;blobCache.clear();prefetching.clear();library.innerHTML='';document.getElementById('tools').hidden=true;document.getElementById('summary').hidden=true;audio.removeAttribute('src');audio.load();document.getElementById('connect').hidden=false;document.getElementById('refresh').hidden=true;document.getElementById('disconnect').hidden=true;status('Disconnected.')};
async function loadFiles(){
 status('Reading Google Drive files and album folders...'); files=[]; folderNames.clear(); let pageToken=''; let total=0;
 try{
  // Read folder names so each song can be grouped by its Drive folder (album).
  let folderPage='';
  do{
   const fp=new URLSearchParams({pageSize:'1000',fields:'nextPageToken,files(id,name)',q:"trashed=false and mimeType='application/vnd.google-apps.folder'",spaces:'drive',includeItemsFromAllDrives:'true',supportsAllDrives:'true'});
   if(folderPage)fp.set('pageToken',folderPage);
   const fr=await fetch('https://www.googleapis.com/drive/v3/files?'+fp.toString(),{headers:{Authorization:'Bearer '+token}});
   if(!fr.ok)break; const fd=await fr.json(); (fd.files||[]).forEach(x=>folderNames.set(x.id,x.name)); folderPage=fd.nextPageToken||'';
  }while(folderPage);
  do{
   const p=new URLSearchParams({pageSize:'1000',orderBy:'name',fields:'nextPageToken,files(id,name,mimeType,size,parents,webViewLink,webContentLink)',spaces:'drive',q:"trashed=false and mimeType!='application/vnd.google-apps.folder'",includeItemsFromAllDrives:'true',supportsAllDrives:'true'});
   if(pageToken)p.set('pageToken',pageToken);
   const r=await fetch('https://www.googleapis.com/drive/v3/files?'+p.toString(),{headers:{Authorization:'Bearer '+token}});
   const text=await r.text();
   if(!r.ok){status('Drive error: HTTP '+r.status+' — '+text.slice(0,250)); return}
   const data=JSON.parse(text); const batch=data.files||[]; total+=batch.length;
   files.push(...batch.filter(f=>AUDIO_EXT.test(f.name||'')||/^audio\//i.test(f.mimeType||'')));
   pageToken=data.nextPageToken||'';
  }while(pageToken);
  files.sort((a,b)=>albumFor(a).localeCompare(albumFor(b),undefined,{numeric:true,sensitivity:'base'})||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  if(!files.length){
    library.innerHTML='';
    status('Drive connection works, but no MP3/FLAC/audio files were found. Drive files scanned: '+total);
    const note=document.createElement('div'); note.style.cssText='grid-column:1/-1;padding:18px;background:#191d24;border-radius:12px;color:#aab1bc;line-height:1.6';
    note.innerHTML='<b style="color:#fff">No music detected</b><br>Make sure the MP3/FLAC files are in this Google account’s Drive. If they are inside “Shared with me” or another account, tell me and I will adjust the player.';
    library.appendChild(note); return;
  }
  render();
 }catch(e){console.error(e);status('Could not read Google Drive: '+e.message)}
}
async function getBlob(f,controller){
 if(blobCache.has(f.id)) return blobCache.get(f.id);
 if(prefetching.has(f.id)) return prefetching.get(f.id);
 const promise=(async()=>{
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media',{headers:{Authorization:'Bearer '+token},signal:controller?.signal});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const blob=await r.blob();
  blobCache.set(f.id,blob);
  return blob;
 })();
 prefetching.set(f.id,promise);
 try{return await promise}finally{prefetching.delete(f.id)}
}
function nextFile(){
 if(!files.length)return null;
 if(shuffle){if(files.length===1)return files[0];let n;do{n=Math.floor(Math.random()*files.length)}while(n===currentIndex);return files[n]}
 return files[(currentIndex+1)%files.length];
}
function prefetchNext(){ return nextFile(); }
async function play(f){
 if(activeController)activeController.abort();
 activeController=new AbortController();
 status('Loading '+f.name+'...');document.getElementById('now').textContent=f.name;render();
 try{
  if(f.webContentLink){
   if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}
   audio.src=f.webContentLink; audio.load(); await audio.play();
  }else{
   const blob=await getBlob(f,activeController);
   if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);
   currentObjectUrl=URL.createObjectURL(blob); audio.src=currentObjectUrl; await audio.play();
  }
  status('Playing: '+f.name); updateMediaSession(f); setupMediaSession();
 }catch(e){
  if(e.name==='AbortError') return;
  try{
   const blob=await getBlob(f,activeController);
   if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);
   currentObjectUrl=URL.createObjectURL(blob); audio.src=currentObjectUrl; await audio.play();
   status('Playing: '+f.name); updateMediaSession(f); setupMediaSession();
  }catch(e2){
   if(e2.name==='AbortError') return;
   console.error(e2); status('Could not play '+f.name+': '+e2.message);
  }
 }
}
function playNext(){if(!files.length)return;if(activeController)activeController.abort();if(shuffle){let n;if(files.length===1)n=0;else{do{n=Math.floor(Math.random()*files.length)}while(n===currentIndex)}currentIndex=n}else{currentIndex=(currentIndex+1)%files.length}play(files[currentIndex])}
function playPrev(){if(!files.length)return;if(activeController)activeController.abort();currentIndex=(currentIndex-1+files.length)%files.length;play(files[currentIndex])}
document.getElementById('next').onclick=playNext;document.getElementById('prev').onclick=playPrev;
document.getElementById('shuffle').onclick=()=>{shuffle=!shuffle;updateMode()};document.getElementById('repeat').onclick=()=>{repeat=!repeat;updateMode()};
function updateMode(){document.getElementById('mode').textContent='Shuffle: '+(shuffle?'On':'Off')+' · Repeat: '+(repeat?'On':'Off')}
function updatePlayButton(){toggleBtn.textContent=audio.paused?'▶':'❚❚'}
toggleBtn.onclick=()=>{if(audio.paused){audio.play().catch(()=>{});}else audio.pause()};
audio.addEventListener('play',updatePlayButton);audio.addEventListener('pause',updatePlayButton);
function setupMediaSession(){
 if(!('mediaSession' in navigator)) return;
 const handlers={
  play:()=>audio.play().catch(()=>{}),
  pause:()=>audio.pause(),
  nexttrack:()=>playNext(),
  previoustrack:()=>playPrev(),
  seekbackward:()=>{audio.currentTime=Math.max(0,audio.currentTime-10)},
  seekforward:()=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10)}
 };
 for(const [action,fn] of Object.entries(handlers)){try{navigator.mediaSession.setActionHandler(action,fn)}catch(e){}}
}
function updateMediaSession(f){
 if(!('mediaSession' in navigator)||!f) return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:f.name.replace(/\.[^.]+$/,''),artist:'My Drive Music',album:albumFor(f)});navigator.mediaSession.playbackState=audio.paused?'paused':'playing';if(Number.isFinite(audio.duration)&&audio.duration>0&&navigator.mediaSession.setPositionState)navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)});}catch(e){}
}
audio.addEventListener('play',()=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('pause',()=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
audio.addEventListener('loadedmetadata',()=>{const f=files[currentIndex];if(f)updateMediaSession(f)});
audio.addEventListener('ended',()=>{if(repeat&&currentIndex>=0)play(files[currentIndex]);else playNext()});
search.addEventListener('input',render);document.querySelectorAll('#viewTabs button').forEach(b=>b.addEventListener('click',()=>{viewMode=b.dataset.view;document.querySelectorAll('#viewTabs button').forEach(x=>x.classList.toggle('active',x===b));render()}));document.getElementById('searchIcon').onclick=()=>{document.getElementById('tools').hidden=!document.getElementById('tools').hidden;if(!document.getElementById('tools').hidden)search.focus()};document.getElementById('shuffleAll').onclick=()=>{shuffle=true;updateMode();playNext()};document.getElementById('listMode').onclick=()=>{viewMode=viewMode==='album'?'title':'album';document.querySelectorAll('#viewTabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===viewMode));render()};window.addEventListener('load',()=>{init();setupMediaSession()});
</script>
</body>
</html>
