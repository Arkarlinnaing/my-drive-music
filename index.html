<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Drive Music - V3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font-family:Arial,sans-serif;padding-bottom:118px}header{padding:16px 20px;background:#181b21;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #2a2e36}h1{margin:0;flex:1;font-size:20px}.btn{padding:9px 13px;border:0;border-radius:9px;font-weight:bold;cursor:pointer;background:#2b3039;color:#fff}.btn:hover{background:#3a414c}.primary{background:#fff;color:#111}.wrap{max-width:1100px;margin:auto;padding:18px}.status{color:#aab1bc;margin-bottom:14px}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;min-width:0;background:#191d24;color:#fff;border:1px solid #333945;border-radius:9px;padding:11px 13px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:#191d24;padding:15px;border-radius:12px;cursor:pointer;border:1px solid transparent}.card:hover{background:#242932;border-color:#3a414c}.card.active{border-color:#fff}.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#8f98a5;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player{position:fixed;bottom:0;left:0;right:0;background:#181b21;border-top:1px solid #30343c;padding:11px 18px;z-index:10}.now{font-weight:bold;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;gap:8px;margin-bottom:7px}.controls .btn{padding:6px 10px}.mode{font-size:12px;color:#aab1bc;margin-left:auto}audio{width:100%;height:36px}@media(max-width:600px){header{padding:12px}.wrap{padding:12px}.grid{grid-template-columns:1fr}.player{padding:9px 10px}.mode{display:none}}
</style>
</head>
<body>
<header>
<h1>🎵 My Drive Music</h1>
<button class="btn primary" id="connect">Connect Google Drive</button>
<button class="btn" id="refresh" hidden>↻ Refresh</button><button class="btn" id="disconnect" hidden>Disconnect</button>
</header>
<div class="wrap">
<div class="status" id="status">Ready — connect your Google Drive.</div>
<div class="tools" id="tools" hidden><input id="search" placeholder="Search songs..."></div>
<div id="library" class="grid"></div>
</div>
<div class="player">
<div class="now" id="now">Nothing playing</div>
<div class="controls">
<button class="btn" id="prev">⏮</button><button class="btn" id="next">⏭</button>
<button class="btn" id="shuffle">🔀</button><button class="btn" id="repeat">🔁</button>
<span class="mode" id="mode">Shuffle: Off · Repeat: Off</span>
</div>
<audio id="audio" controls preload="metadata"></audio>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
const CLIENT_ID="47016789140-ro981mmscma2m2mm89agnnojddfk00lv.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/drive.readonly";
const AUDIO_EXT=/\.(mp3|flac|m4a|mp4|ogg|oga|wav|aac|opus)$/i;
let token=null,tokenClient,files=[],visibleFiles=[],currentIndex=-1,shuffle=false,repeat=false,currentObjectUrl=null;
let activeController=null;
const blobCache=new Map();
const prefetching=new Map();
const statusEl=document.getElementById('status'),library=document.getElementById('library'),audio=document.getElementById('audio'),search=document.getElementById('search');
function status(x){statusEl.textContent=x}
function formatSize(bytes){if(!bytes)return '';const n=Number(bytes);if(n<1048576)return Math.round(n/1024)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'}
function extension(name){const m=name.match(/\.([^.]+)$/);return m?m[1].toUpperCase():'AUDIO'}
function render(){
 const term=search.value.trim().toLowerCase();
 visibleFiles=files.filter(f=>!term||f.name.toLowerCase().includes(term));
 library.innerHTML='';
 if(!visibleFiles.length){status(files.length?'No matching music.':'No audio files found in Drive.');return}
 status(visibleFiles.length+' music file(s) shown · '+files.length+' total');
 visibleFiles.forEach((f,i)=>{const c=document.createElement('div');c.className='card';if(files[currentIndex]?.id===f.id)c.classList.add('active');
 c.innerHTML='<div class="name"></div><div class="meta"></div>';c.querySelector('.name').textContent=f.name;c.querySelector('.meta').textContent=extension(f.name)+(f.size?' · '+formatSize(f.size):'');c.onclick=()=>playFileByVisibleIndex(i);library.appendChild(c)});
}
function playFileByVisibleIndex(i){const f=visibleFiles[i];currentIndex=files.findIndex(x=>x.id===f.id);play(f)}
function init(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async r=>{if(r.error){status('Google authorization failed: '+r.error);return}token=r.access_token;document.getElementById('connect').hidden=true;document.getElementById('disconnect').hidden=false;document.getElementById('refresh').hidden=false;document.getElementById('tools').hidden=false;await loadFiles()}})}
document.getElementById('connect').onclick=()=>tokenClient.requestAccessToken({prompt:'consent'});
document.getElementById('refresh').onclick=()=>{if(token)loadFiles()};
document.getElementById('disconnect').onclick=()=>{if(activeController)activeController.abort();if(token)google.accounts.oauth2.revoke(token);token=null;files=[];visibleFiles=[];currentIndex=-1;blobCache.clear();prefetching.clear();library.innerHTML='';document.getElementById('tools').hidden=true;audio.removeAttribute('src');audio.load();document.getElementById('connect').hidden=false;document.getElementById('refresh').hidden=true;document.getElementById('disconnect').hidden=true;status('Disconnected.')};
async function loadFiles(){
 status('Reading Google Drive files...'); files=[]; let pageToken=''; let total=0;
 try{
  do{
   const p=new URLSearchParams({pageSize:'1000',orderBy:'name',fields:'nextPageToken,files(id,name,mimeType,size,parents,webViewLink)',spaces:'drive',q:"trashed=false and mimeType!='application/vnd.google-apps.folder'",includeItemsFromAllDrives:'true',supportsAllDrives:'true'});
   if(pageToken)p.set('pageToken',pageToken);
   const r=await fetch('https://www.googleapis.com/drive/v3/files?'+p.toString(),{headers:{Authorization:'Bearer '+token}});
   const text=await r.text();
   if(!r.ok){status('Drive error: HTTP '+r.status+' — '+text.slice(0,250)); return}
   const data=JSON.parse(text); const batch=data.files||[]; total+=batch.length;
   files.push(...batch.filter(f=>AUDIO_EXT.test(f.name||'')||/^audio\//i.test(f.mimeType||'')));
   pageToken=data.nextPageToken||'';
  }while(pageToken);
  files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  if(!files.length){
    library.innerHTML='';
    status('Drive connection works, but no MP3/FLAC/audio files were found. Drive files scanned: '+total);
    const note=document.createElement('div'); note.style.cssText='grid-column:1/-1;padding:18px;background:#191d24;border-radius:12px;color:#aab1bc;line-height:1.6';
    note.innerHTML='<b style="color:#fff">No music detected</b><br>Make sure the MP3/FLAC files are in this Google account’s Drive. If they are inside “Shared with me” or another account, tell me and I will adjust the player.';
    library.appendChild(note); return;
  }
  render();
 }catch(e){console.error(e);status('Could not read Google Drive: '+e.message)}
}
async function getBlob(f,controller){
 if(blobCache.has(f.id)) return blobCache.get(f.id);
 if(prefetching.has(f.id)) return prefetching.get(f.id);
 const promise=(async()=>{
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media',{headers:{Authorization:'Bearer '+token},signal:controller?.signal});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const blob=await r.blob();
  blobCache.set(f.id,blob);
  return blob;
 })();
 prefetching.set(f.id,promise);
 try{return await promise}finally{prefetching.delete(f.id)}
}
function nextFile(){
 if(!files.length)return null;
 if(shuffle){if(files.length===1)return files[0];let n;do{n=Math.floor(Math.random()*files.length)}while(n===currentIndex);return files[n]}
 return files[(currentIndex+1)%files.length];
}
function prefetchNext(){
 const f=nextFile(); if(!f || blobCache.has(f.id) || prefetching.has(f.id) || !token)return;
 getBlob(f).then(()=>{}).catch(()=>{});
}
async function play(f){
 if(activeController)activeController.abort();
 activeController=new AbortController();
 status('Loading '+f.name+'...');document.getElementById('now').textContent=f.name;render();
 try{
  const blob=await getBlob(f,activeController);
  if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl=URL.createObjectURL(blob);audio.src=currentObjectUrl;await audio.play();
  status('Playing: '+f.name);
  // Download the next song in the background so Next is much faster.
  prefetchNext();
 }catch(e){
  if(e.name==='AbortError') return;
  console.error(e);status('Could not play '+f.name+': '+e.message);
 }
}
function playNext(){if(!files.length)return;if(activeController)activeController.abort();if(shuffle){let n;if(files.length===1)n=0;else{do{n=Math.floor(Math.random()*files.length)}while(n===currentIndex)}currentIndex=n}else{currentIndex=(currentIndex+1)%files.length}play(files[currentIndex])}
function playPrev(){if(!files.length)return;if(activeController)activeController.abort();currentIndex=(currentIndex-1+files.length)%files.length;play(files[currentIndex])}
document.getElementById('next').onclick=playNext;document.getElementById('prev').onclick=playPrev;
document.getElementById('shuffle').onclick=()=>{shuffle=!shuffle;updateMode()};document.getElementById('repeat').onclick=()=>{repeat=!repeat;updateMode()};
function updateMode(){document.getElementById('mode').textContent='Shuffle: '+(shuffle?'On':'Off')+' · Repeat: '+(repeat?'On':'Off')}
audio.addEventListener('ended',()=>{if(repeat&&currentIndex>=0)play(files[currentIndex]);else playNext()});
search.addEventListener('input',render);window.addEventListener('load',init);
</script>
</body>
</html>
